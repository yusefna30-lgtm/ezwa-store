<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نبيل النمر | بطاقة الأعمال الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #050811;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%);
        }
        .card-container {
            width: 100%;
            max-width: 440px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            padding-bottom: 35px;
        }
        .cover-header {
            height: 140px;
            background: linear-gradient(135deg, #1d4ed8, #7c3aed, #db2777);
            position: relative;
        }
        .profile-section {
            padding: 0 24px;
            text-align: center;
            position: relative;
            margin-top: -65px;
        }
        .avatar-box {
            width: 110px;
            height: 110px;
            margin: 0 auto;
            border-radius: 50%;
            background: #111827;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 3px solid rgba(255, 255, 255, 0.15);
        }
        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #38bdf8;
            font-size: 40px;
            font-weight: 700;
        }
        .name {
            font-size: 24px;
            font-weight: 700;
            margin-top: 14px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        .title {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 6px;
            font-weight: 400;
        }
        .links-list {
            padding: 24px 24px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.09);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .btn-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-arrow {
            font-size: 12px;
            color: #64748b;
            transition: transform 0.2s;
        }
        .btn:hover .btn-arrow {
            transform: translateX(-3px);
            color: #ffffff;
        }
        
        /* Custom Brand Colors for Icons */
        .btn.phone .icon-box { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .btn.whatsapp .icon-box { color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .btn.insta .icon-box { color: #ec4899; background: rgba(236, 72, 153, 0.1); }
        .btn.snap .icon-box { color: #facc15; background: rgba(250, 204, 21, 0.1); }
        .btn.tiktok .icon-box { color: #f8fafc; background: rgba(255, 255, 255, 0.1); }
        .btn.map .icon-box { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        .footer-brand {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #475569;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="cover-header"></div>
        
        <div class="profile-section">
            <div class="avatar-box">
                <div class="avatar-inner">ن</div>
            </div>
            <div class="name">نبيل النمر</div>
            <div class="title">رائد أعمال ومستشار تسويقي</div>
        </div>

        <div class="links-list">
            <a href="tel:+966502777884" class="btn phone">
                <div class="btn-content">
                    <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
                    <span>اتصال مباشر (1)</span>
                </div>
                <i class="fa-solid fa-chevron-left btn-arrow"></i>
            </a>

            <a href="https://wa.me/966502777884" class="btn whatsapp" target="_blank">
                <div class="btn-content">
                    <div class="icon-box"><i class="fa-brands fa-whatsapp"></i></div>
                    <span>واتساب (1)</span>
                </div>
                <i class="fa-solid fa-chevron-left btn-arrow"></i>
            </a>

            <a href="https://www.instagram.com/alnamer.nabeel?rpxt=bnV2Nm9vNGxheno5" class="btn insta" target="_blank">
                <div class="btn-content">
                    <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                    <span>إنستغرام</span>
                </div>
                <i class="fa-solid fa-chevron-left btn-arrow"></i>
            </a>

            <a href="https://www.snapchat.com/add/nabilalnamer?share_id=9_DBxLFvhbY&locale=ar-SA" class="btn snap" target="_blank">
                <div class="btn-content">
                    <div class="icon-box"><i class="fa-brands fa-snapchat"></i></div>
                    <span>سناب شات</span>
                </div>
                <i class="fa-solid fa-chevron-left btn-arrow"></i>
            </a>

            <a href="https://www.tiktok.com/@ana4na1?_r=1&_t=ZS-9AbFxL8bQuH" class="btn tiktok" target="_blank">
                <div class="btn-content">
                    <div class="icon-box"><i class="fa-brands fa-tiktok"></i></div>
                    <span>تيك توك</span>
                </div>
                <i class="fa-solid fa-chevron-left btn-arrow"></i>
            </a>

            <a href="https://maps.app.goo.gl/LcrQDjX7453h4cqN8?g_st=ac" class="btn map" target="_blank">
                <div class="btn-content">
                    <div class="icon-box"><i class="fa-solid fa-location-dot"></i></div>
                    <span>موقع الخرائط</span>
                </div>
                <i class="fa-solid fa-chevron-left btn-arrow"></i>
            </a>
        </div>

        <div class="footer-brand">DIGITAL BUSINESS CARD</div>
    </div>

</body>
</html>
